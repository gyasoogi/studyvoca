        const AuthScreen = () => {
          const [studentId, setStudentId] = useState('');
          const [password, setPassword] = useState('');
          const [isLoginView, setIsLoginView] = useState(true);
          const [errorMsg, setErrorMsg] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const handleAuth = async (e) => {
            e.preventDefault();
            setErrorMsg('');
            setIsLoading(true);
            const email = `${studentId}@vocalearn.app`;
            try {
              if (isLoginView) {
                await auth.signInWithEmailAndPassword(email, password);
              } else {
                await auth.createUserWithEmailAndPassword(email, password);
                alert("회원가입이 완료되었습니다!");
              }
            } catch (error) {
              console.error(error);
              switch (error.code) {
                case 'auth/invalid-email': setErrorMsg('올바른 학번 형식이 아닙니다.'); break;
                case 'auth/user-not-found':
                case 'auth/invalid-credential': setErrorMsg('가입되지 않은 학번이거나 비밀번호가 틀렸습니다.'); break;
                case 'auth/wrong-password': setErrorMsg('비밀번호가 틀렸습니다.'); break;
                case 'auth/email-already-in-use': setErrorMsg('이미 가입된 학번입니다.'); break;
                case 'auth/weak-password': setErrorMsg('비밀번호는 6자리 이상이어야 합니다.'); break;
                default: setErrorMsg('오류가 발생했습니다: ' + error.message);
              }
            } finally { setIsLoading(false); }
          };
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50">
              <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 max-w-sm w-full">
                <div className="text-center mb-8">
                  <GraduationCap size={48} className="mx-auto text-indigo-600 mb-3" />
                  <h1 className="text-2xl font-black text-slate-800">VOCA CHALLENGE</h1>
                  <p className="text-slate-500 font-medium mt-1">학번으로 시작하세요</p>
                </div>
                <form onSubmit={handleAuth} className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">학번</label>
                    <input type="text" required value={studentId} onChange={(e) => setStudentId(e.target.value)} placeholder="예: 20101" className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">비밀번호</label>
                    <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} placeholder="비밀번호 (6자리 이상)" className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition" />
                  </div>
                  {errorMsg && <p className="text-red-500 text-sm font-bold text-center">{errorMsg}</p>}
                  <button type="submit" disabled={isLoading} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition disabled:opacity-50">{isLoading ? '처리 중...' : (isLoginView ? '로그인' : '회원가입')}</button>
                </form>
                <div className="mt-6 text-center">
                  <button onClick={() => { setIsLoginView(!isLoginView); setErrorMsg(''); }} className="text-slate-500 hover:text-indigo-600 font-bold text-sm transition">{isLoginView ? '처음이신가요? 회원가입하기' : '이미 계정이 있으신가요? 로그인하기'}</button>
                </div>
              </div>
            </div>
          );
        };
        const App = () => {
          const [user, setUser] = useState(null);
          const [authLoading, setAuthLoading] = useState(true);
          const [starredIds, setStarredIds] = useState(new Set());
          const [view, setView] = useState('home');
          const [selectedDay, setSelectedDay] = useState(47);
          const [onlyStarred, setOnlyStarred] = useState(false);
          const [starredFilterDay, setStarredFilterDay] = useState('all');
          const [testQuestions, setTestQuestions] = useState([]);
          const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
          const [testScore, setTestScore] = useState(0);
          const [testFinished, setTestFinished] = useState(false);
          const [selectedAnswer, setSelectedAnswer] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);
          const [testType, setTestType] = useState(1);
          const [answerHistory, setAnswerHistory] = useState([]);
          const timerRef = useRef(null);
          const days = [47, 48, 49, 50, 51, 52, 53];
          useEffect(() => {
            const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
              setUser(currentUser);
              try {
                if (currentUser) {
                  const doc = await db.collection('users').doc(currentUser.uid).get();
                  if (doc.exists && doc.data().starredIds) setStarredIds(new Set(doc.data().starredIds));
                  else setStarredIds(new Set());
                } else {
                  setStarredIds(new Set());
                }
              } catch (error) {
                console.error("별표 목록을 불러오는 중 오류:", error);
              } finally {
                setAuthLoading(false);
              }
            });
            return () => {
              unsubscribe();
              if (timerRef.current) clearTimeout(timerRef.current);
            };
          }, []);
          const handleLogout = () => auth.signOut();
          const toggleStar = async (id) => {
            if (!user) return;
            const newStarred = new Set(starredIds);
            if (newStarred.has(id)) newStarred.delete(id);
            else newStarred.add(id);
            setStarredIds(newStarred);
            try {
              await db.collection('users').doc(user.uid).set({ starredIds: Array.from(newStarred) }, { merge: true });
            } catch (error) {
              console.error("저장 중 오류 발생:", error);
            }
          };
          const filteredWords = useMemo(() => {
            if (onlyStarred) {
              let list = vocabularyData.filter(w => starredIds.has(w.id));
              if (starredFilterDay !== 'all') list = list.filter(w => w.day === parseInt(starredFilterDay));
              return list;
            }
            return vocabularyData.filter(w => w.day === selectedDay);
          }, [selectedDay, onlyStarred, starredIds, starredFilterDay]);
          const startTest = (type, targetPool = null) => {
            const pool = targetPool || (onlyStarred
              ? vocabularyData.filter(w => starredIds.has(w.id))
              : vocabularyData.filter(w => w.day === selectedDay));
            if (pool.length < 4) {
              alert(`테스트를 생성하기에 단어가 부족합니다. (최소 4개 필요 / 현재 ${pool.length}개)`);
              return;
            }
            const shuffled = [...pool].sort(() => Math.random() - 0.5);
            const questions = shuffled.map(word => {
              const optionMap = new Map([[word.id, word]]);
              while (optionMap.size < 4) {
                const randomWord = vocabularyData[Math.floor(Math.random() * vocabularyData.length)];
                if (randomWord.id !== word.id) optionMap.set(randomWord.id, randomWord);
              }
              return { word, options: [...optionMap.values()].sort(() => Math.random() - 0.5) };
            });
            if (timerRef.current) clearTimeout(timerRef.current);
            setTestType(type);
            setTestQuestions(questions);
            setCurrentQuestionIdx(0);
            setTestScore(0);
            setTestFinished(false);
            setIsAnswered(false);
            setSelectedAnswer(null);
            setAnswerHistory([]);
            setView('test');
          };
          const nextQuestion = () => {
            if (currentQuestionIdx < testQuestions.length - 1) {
              setCurrentQuestionIdx(prev => prev + 1);
              setIsAnswered(false);
              setSelectedAnswer(null);
            } else {
              setTestFinished(true);
            }
          };
          const handleAnswer = (option) => {
            if (isAnswered) return;
            const question = testQuestions[currentQuestionIdx];
            const isCorrect = option !== null && option.id === question.word.id;
            setSelectedAnswer(option);
            setIsAnswered(true);
            setAnswerHistory(prev => [...prev, { questionId: question.word.id, correct: isCorrect }]);
            if (isCorrect) setTestScore(prev => prev + 1);
            else if (!starredIds.has(question.word.id)) toggleStar(question.word.id);
            if (timerRef.current) clearTimeout(timerRef.current);
            timerRef.current = setTimeout(() => {
              nextQuestion();
            }, isCorrect ? 1000 : 2500);
          };
          if (authLoading) return <div className="min-h-screen flex items-center justify-center text-indigo-600 font-bold">로딩 중...</div>;
          if (!user) return <AuthScreen />;
          const answeredCount = answerHistory.length;
          const wrongCount = answeredCount - testScore;
          const correctRate = answeredCount ? (testScore / answeredCount) * 100 : 0;
          const wrongRate = answeredCount ? (wrongCount / answeredCount) * 100 : 0;
          return (
            <div className="min-h-screen pb-28">
              <header className="bg-indigo-700 text-white px-6 py-5 sticky top-0 z-20 shadow-lg flex justify-between items-center">
                <h1 className="text-xl font-black tracking-tight flex items-center gap-2"><GraduationCap size={26} /> VOCA</h1>
                <div className="flex items-center gap-3">
                  <span className="text-xs bg-indigo-800 px-3 py-1 rounded-full font-bold">{user.email.split('@')[0]}님</span>
                  {view !== 'home' ? (
                    <button onClick={() => { if (timerRef.current) clearTimeout(timerRef.current); setView('home'); }} className="p-2 bg-indigo-800 rounded-full hover:bg-indigo-900 transition"><Home size={20} /></button>
                  ) : (
                    <button onClick={handleLogout} className="p-2 bg-indigo-800 rounded-full hover:bg-indigo-900 transition text-red-300"><LogOutIcon size={20} /></button>
                  )}
                </div>
              </header>
              <main className="max-w-xl mx-auto p-4 pt-6">
                {view === 'home' && (
                  <div className="space-y-6">
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2"><BookOpen size={20} className="text-indigo-600" /> Day별 암기 (뜻 전용)</h2>
                      <div className="grid grid-cols-3 gap-3">
                        {days.map(day => <button key={day} onClick={() => { setSelectedDay(day); setView('learn'); setOnlyStarred(false); }} className="py-6 rounded-2xl border border-slate-100 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 transition-all font-black text-2xl text-slate-700">{day}</button>)}
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                      <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2"><Brain size={20} className="text-indigo-600" /> 전체 범위 실전 테스트</h2>
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => startTest(1, vocabularyData)} className="bg-indigo-600 text-white p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-md hover:bg-indigo-700 transition"><ListChecks size={24} /><span className="font-bold">예문 빈칸</span></button>
                        <button onClick={() => startTest(2, vocabularyData)} className="bg-indigo-400 text-white p-4 rounded-2xl flex flex-col items-center justify-center gap-2 shadow-md hover:bg-indigo-500 transition"><RotateCcw size={24} /><span className="font-bold">뜻 매칭</span></button>
                      </div>
                    </div>
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                      <button onClick={() => { setOnlyStarred(true); setStarredFilterDay('all'); setView('learn'); }} className="w-full bg-amber-500 text-white p-5 rounded-2xl flex items-center justify-between shadow-md hover:bg-amber-600 transition">
                        <div className="text-left"><p className="text-xl font-black">별표 단어장</p><p className="text-amber-100 text-sm">오답 및 중요 단어 모음 · {starredIds.size}개</p></div><Star fill="white" size={32} />
                      </button>
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => startTest(1, vocabularyData.filter(w => starredIds.has(w.id)))} className="bg-indigo-600 text-white p-4 rounded-2xl font-bold hover:bg-indigo-700 transition"><ListChecks size={22} className="mx-auto mb-2" />별표 예문 테스트</button>
                        <button onClick={() => startTest(2, vocabularyData.filter(w => starredIds.has(w.id)))} className="bg-indigo-400 text-white p-4 rounded-2xl font-bold hover:bg-indigo-500 transition"><RotateCcw size={22} className="mx-auto mb-2" />별표 뜻 매칭</button>
                      </div>
                    </div>
                  </div>
                )}
                {view === 'learn' && (
                  <div className="space-y-4">
                    <div className="flex flex-col gap-1 mb-6">
                      <h2 className="text-3xl font-black text-slate-900">{onlyStarred ? "별표 목록" : `Day ${selectedDay}`}</h2>
                      <p className="text-slate-400 font-medium">총 {filteredWords.length}개의 단어가 있습니다.</p>
                    </div>
                    {onlyStarred && <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide mb-4">
                      <button onClick={() => setStarredFilterDay('all')} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition ${starredFilterDay === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-400 border border-slate-200'}`}>전체</button>
                      {days.map(d => <button key={d} onClick={() => setStarredFilterDay(String(d))} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition ${starredFilterDay === String(d) ? 'bg-indigo-600 text-white' : 'bg-white text-slate-400 border border-slate-200'}`}>Day {d}</button>)}
                    </div>}
                    <div className="grid grid-cols-2 gap-3 mb-6">
                      <button onClick={() => startTest(1, onlyStarred ? vocabularyData.filter(w => starredIds.has(w.id) && (starredFilterDay === 'all' || w.day === Number(starredFilterDay))) : vocabularyData.filter(w => w.day === selectedDay))} className="bg-white border-2 border-indigo-100 p-3 rounded-2xl flex items-center justify-center gap-2 text-indigo-700 font-bold hover:bg-indigo-50"><ListChecks size={18} />{onlyStarred ? "별표 예문 테스트" : "예문 테스트"}</button>
                      <button onClick={() => startTest(2, onlyStarred ? vocabularyData.filter(w => starredIds.has(w.id) && (starredFilterDay === 'all' || w.day === Number(starredFilterDay))) : vocabularyData.filter(w => w.day === selectedDay))} className="bg-white border-2 border-indigo-100 p-3 rounded-2xl flex items-center justify-center gap-2 text-indigo-700 font-bold hover:bg-indigo-50"><Brain size={18} />{onlyStarred ? "별표 뜻 매칭" : "뜻 매칭"}</button>
                    </div>
                    {filteredWords.length === 0 ? (
                      <div className="text-center py-24 bg-white rounded-3xl border border-dashed border-slate-300"><Star size={48} className="mx-auto text-slate-200 mb-4" /><p className="text-slate-400 font-bold">리스트가 비어있습니다.</p></div>
                    ) : (
                      <div className="grid gap-3">
                        {filteredWords.map(w => <div key={w.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                          <div className="flex-1"><h3 className="text-2xl font-black text-indigo-800 mb-1">{w.word}</h3><p className="text-slate-600 font-medium">{w.meaning}</p></div>
                          <button onClick={() => toggleStar(w.id)} className={`ml-4 p-3 rounded-2xl transition ${starredIds.has(w.id) ? 'text-amber-400 bg-amber-50' : 'text-slate-200 bg-slate-50'}`}><Star fill={starredIds.has(w.id) ? "currentColor" : "none"} size={28} /></button>
                        </div>)}
                      </div>
                    )}
                  </div>
                )}
                {view === 'test' && !testFinished && testQuestions.length > 0 && (
                  <div>
                    <div className="flex justify-between items-center mb-3 px-2 font-black text-slate-400">
                      <span className="text-xs">Q {currentQuestionIdx + 1} / {testQuestions.length}</span>
                      <div className="flex-1 mx-4 h-2 bg-slate-200 rounded-full overflow-hidden"><div className={`h-full transition-all duration-300 ${testType === 1 ? 'bg-indigo-500' : 'bg-indigo-400'}`} style={{ width: `${((currentQuestionIdx + 1) / testQuestions.length) * 100}%` }} /></div>
                      <button onClick={() => { if (timerRef.current) clearTimeout(timerRef.current); setView('home'); }} className="text-xs hover:text-red-500">EXIT</button>
                    </div>
                    <div className="mb-6 px-2">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-xs font-black text-slate-500">정답률 · {answeredCount}문제 풀이</span>
                        <span className="text-xs font-black text-indigo-600">{Math.round(correctRate)}%</span>
                      </div>
                      <div className="flex w-full h-3 overflow-hidden rounded-full bg-slate-200">
                        <div className="h-full bg-emerald-500 transition-all duration-300" style={{ width: `${correctRate}%` }} />
                        <div className="h-full bg-red-400 transition-all duration-300" style={{ width: `${wrongRate}%` }} />
                      </div>
                      <div className="flex justify-between mt-2 text-xs font-bold"><span className="text-emerald-600">맞음 {testScore}</span><span className="text-red-500">틀림 {wrongCount}</span></div>
                    </div>
                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 mb-6 text-center">
                      {testType === 1 ? (
                        <div className="space-y-6">
                          <div className="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-black rounded-full uppercase tracking-widest">Sentence Challenge</div>
                          <p className="text-2xl font-bold text-slate-800 leading-relaxed italic">
                            {testQuestions[currentQuestionIdx].word.sentence.split(new RegExp(`(${escapeRegExp(testQuestions[currentQuestionIdx].word.word)})`, 'i')).map((part, i) => (
                              <span key={i} className={part.toLowerCase() === testQuestions[currentQuestionIdx].word.word.toLowerCase() ? "inline-block border-b-4 border-indigo-400 px-4 mx-1 text-indigo-400/10" : ""}>{part.toLowerCase() === testQuestions[currentQuestionIdx].word.word.toLowerCase() ? "____" : part}</span>
                            ))}
                          </p>
                          <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100"><p className="text-slate-500 font-bold text-sm">해석: {testQuestions[currentQuestionIdx].word.translation}</p></div>
                        </div>
                      ) : (
                        <div className="space-y-6">
                          <div className="inline-block px-3 py-1 bg-indigo-50 text-indigo-400 text-xs font-black rounded-full uppercase tracking-widest">Meaning Match</div>
                          <div className="py-6"><span className="text-5xl font-black text-slate-900 tracking-tight">{testQuestions[currentQuestionIdx].word.word}</span></div>
                          <p className="text-slate-400 font-bold">위 단어의 뜻을 고르세요.</p>
                        </div>
                      )}
                    </div>
                    <div className="grid grid-cols-1 gap-3">
                      {testQuestions[currentQuestionIdx].options.map(opt => {
                        const currentWord = testQuestions[currentQuestionIdx].word;
                        const isCorrectOption = opt.id === currentWord.id;
                        const isSelectedOption = selectedAnswer?.id === opt.id;
                        let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 shadow-sm";
                        if (isAnswered) {
                          if (isCorrectOption) btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-800 scale-[1.02] shadow-emerald-100";
                          else if (isSelectedOption) btnStyle = "bg-red-50 border-red-400 text-red-600";
                          else btnStyle = "bg-white border-slate-100 opacity-40";
                        } else {
                          btnStyle = "bg-white border-2 border-slate-200 hover:border-indigo-400 active:scale-[0.98]";
                        }
                        return <button key={opt.id} onClick={() => handleAnswer(opt)} disabled={isAnswered} className={`p-5 rounded-2xl text-left font-black transition-all flex justify-between items-center ${btnStyle}`}><span className="text-lg">{testType === 1 ? opt.word : opt.meaning}</span>{isAnswered && isCorrectOption && <CheckCircle2 className="text-emerald-500" size={24} />}{isAnswered && isSelectedOption && !isCorrectOption && <AlertCircle className="text-red-500" size={24} />}</button>;
                      })}
                    </div>
                    {!isAnswered && <button onClick={() => handleAnswer(null)} className="w-full mt-3 p-4 rounded-2xl border-2 border-dashed border-slate-300 bg-slate-100 text-slate-500 font-black hover:bg-slate-200 hover:border-slate-400 active:scale-[0.98] transition">모르겠다</button>}
                    {isAnswered && selectedAnswer === null && <div className="mt-4 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-center"><p className="font-black text-amber-700">정답을 모르겠어요!</p><p className="mt-1 text-sm font-bold text-amber-600">정답: {testQuestions[currentQuestionIdx].word.word} — {testQuestions[currentQuestionIdx].word.meaning}</p><p className="mt-1 text-xs text-amber-600">별표 단어장에 저장되었습니다.</p></div>}
                    {isAnswered && selectedAnswer !== null && selectedAnswer.id !== testQuestions[currentQuestionIdx].word.id && <p className="text-center mt-6 text-slate-400 font-bold animate-pulse">정답 확인 후 잠시 후 자동으로 넘어갑니다...</p>}
                  </div>
                )}
                {view === 'test' && testFinished && (
                  <div className="text-center space-y-10 py-10">
                    <div className="relative inline-block">
                      <svg className="w-56 h-56 transform -rotate-90"><circle cx="112" cy="112" r="100" stroke="currentColor" strokeWidth="16" fill="transparent" className="text-slate-200" /><circle cx="112" cy="112" r="100" stroke="currentColor" strokeWidth="16" fill="transparent" strokeDasharray={628.3} strokeDashoffset={628.3 - (628.3 * testScore) / testQuestions.length} className="text-indigo-600 transition-all duration-1000 ease-out" /></svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center"><span className="text-6xl font-black text-slate-800">{Math.round((testScore / testQuestions.length) * 100)}%</span></div>
                    </div>
                    <div className="space-y-4"><h2 className="text-4xl font-black text-slate-900">Finish!</h2><p className="text-slate-500 font-bold text-xl">총 {testQuestions.length}문제 중 {testScore}문제 정답</p><div className="bg-amber-50 text-amber-700 py-3 px-6 rounded-2xl inline-block font-bold">틀린 단어와 모르겠다고 선택한 단어는 별표 리스트에 저장되었습니다.</div></div>
                    <div className="max-w-sm mx-auto bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-4">
                       <p className="font-black text-slate-800 text-lg">모든 테스트가 끝났어요!</p>
                       <p className="text-slate-600 font-medium">정답을 맞힌 단어를 별표 리스트에서 제거할까요?</p>
                       <div className="grid grid-cols-2 gap-3">
                         <button onClick={async () => {
                           const correctIds = answerHistory.filter(item => item.correct).map(item => item.questionId);
                           const updatedStarred = new Set(starredIds);
                           correctIds.forEach(id => updatedStarred.delete(id));
                           setStarredIds(updatedStarred);
                           try {
                             await db.collection('users').doc(user.uid).set({ starredIds: Array.from(updatedStarred) }, { merge: true });
                           } catch (error) {
                             console.error("별표 목록 업데이트 중 오류:", error);
                           }
                           setView('home');
                         }} className="bg-amber-500 text-white p-4 rounded-xl font-black hover:bg-amber-600 transition">제거하기</button>
                         <button onClick={() => setView('home')} className="bg-slate-100 text-slate-700 p-4 rounded-xl font-black hover:bg-slate-200 transition">유지하기</button>
                       </div>
                     </div>
                  </div>
                )}
              </main>
              {view !== 'test' && <nav className="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-slate-200 p-5 max-w-xl mx-auto flex justify-around items-center z-30 rounded-t-[40px] shadow-[-10px_0_30px_rgba(0,0,0,0.05)]">
                <button onClick={() => setView('home')} className={`flex flex-col items-center gap-1 transition-all ${view === 'home' ? 'text-indigo-700' : 'text-slate-300'}`}><Home size={26} strokeWidth={3} /><span className="text-[10px] font-black uppercase tracking-tighter">Home</span></button>
                <button onClick={() => { setOnlyStarred(false); setView('learn'); }} className={`flex flex-col items-center gap-1 transition-all ${view === 'learn' && !onlyStarred ? 'text-indigo-700' : 'text-slate-300'}`}><BookOpen size={26} strokeWidth={3} /><span className="text-[10px] font-black uppercase tracking-tighter">Learn</span></button>
                <button onClick={() => { setOnlyStarred(true); setStarredFilterDay('all'); setView('learn'); }} className={`flex flex-col items-center gap-1 transition-all ${view === 'learn' && onlyStarred ? 'text-amber-500' : 'text-slate-300'}`}><Star size={26} fill={view === 'learn' && onlyStarred ? "currentColor" : "none"} strokeWidth={3} /><span className="text-[10px] font-black uppercase tracking-tighter">Starred</span></button>
              </nav>}
            </div>
          );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
